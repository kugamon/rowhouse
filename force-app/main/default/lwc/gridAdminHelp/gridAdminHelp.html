<template>
    <section class="rh-help" aria-labelledby="rh-help-title">
        <div class="rh-help-top">
            <span class="rh-secnum">Grid Guide</span>
            <span class="rh-help-links">
                <a
                    class="rh-more rh-help-open"
                    href={openUrl}
                    title="This part of the Configuration reference (opens in a new tab)"
                    onclick={handleOpen}
                    >Open ↗</a
                >
                <lightning-button
                    class="rh-help-hide"
                    variant="base"
                    label="Hide help"
                    onclick={handleHide}
                ></lightning-button>
            </span>
        </div>

        <h2 class="rh-help-title" id="rh-help-title">{title}</h2>

        <!-- Each tab's part of the Configuration reference, in a few lines (guide/pages/configure.html). -->
        <template lwc:if={isGrid}>
            <p>
                One per grid. Its title is what users see above the grid; its API name is what you enter in the Rowhouse
                Grid component.
            </p>
            <dl class="rh-help-list">
                <dt>Rows per page</dt>
                <dd>
                    Blank loads the first 200 rows, then 2,000 at a time up to 10,000, then more as users scroll, up to
                    100,000.
                </dd>
                <dt>On a record page</dt>
                <dd>
                    Shows only the records whose lookup points to the page's record, like a related list. None shows the
                    whole list.
                </dd>
                <dt>Frozen columns</dt>
                <dd>
                    How many columns, from the left, stay put as users scroll sideways: 0 to 5. Users can freeze their own
                    from a column's menu.
                </dd>
                <dt>Height in pixels</dt>
                <dd>Blank fills the window. Under 160 counts as 160.</dd>
                <dt>Show row numbers</dt>
                <dd>Selected by default: 1, 2, 3 down the left edge, in the order shown. Deselect it for a narrow grid.</dd>
                <dt>What users can do</dt>
                <dd>
                    Editing, New and export are selected by default. Import, deleting selected rows and logging are not,
                    because each can change many records at once.
                </dd>
                <dt>Create records with New</dt>
                <dd>
                    The New button adds a row at the top of the grid. Salesforce's New form opens instead when the
                    record needs a record type or a required field that isn't an editable column.
                </dd>
                <dt>Require the Export Reports permission</dt>
                <dd>
                    Export shows only for users whose profile or permission sets grant Salesforce's Export Reports
                    permission, as reports require. Deselected by default: everyone who can use the grid can export.
                </dd>
                <dt>Import from a CSV or Excel file</dt>
                <dd>
                    Rows with a record Id update that record; rows without one create a record. So import needs
                    Create records with New, and clearing New clears import too.
                </dd>
                <dt>Delete selected rows</dt>
                <dd>
                    After users confirm, the records go to the Recycle Bin. Users also need delete access to the object
                    and to each record.
                </dd>
                <dt>Log every change in Grid Edit Log</dt>
                <dd>
                    Each field change, and each record created, deleted or used in an action, is logged with the user and
                    time. A change that can't be logged isn't made.
                </dd>
            </dl>
            <div class="rh-call">
                <span class="rh-call-k">Tip</span>
                <p>Once saved, a grid's API name and object can't change. For another object, build another grid.</p>
            </div>
        </template>

        <template lwc:elseif={isColumns}>
            <p>
                One per column, left to right. Leave the header blank to use the field's label. A column a user can't
                read is left out for that user.
            </p>
            <dl class="rh-help-list">
                <dt>Field</dt>
                <dd>
                    The object's fields, then its lookups (Account &gt;): choose one for a field of the related record,
                    up to five lookups away.
                </dd>
                <dt>Edit</dt>
                <dd>
                    Users can change the cell when this is selected, Edit cells in the grid is selected, and they may edit
                    the field. Formulas, roll-ups and auto-numbers never can be.
                </dd>
                <dt>Sort</dt>
                <dd>
                    Users can sort the grid by this column. Long text and formula columns never can be. The badge beside
                    it (1 ↑) is its place in the order the grid opens in, which Edit sort, over the columns, sets: first
                    any field, then up to four of these columns.
                </dd>
                <dt>Wrap</dt>
                <dd>Up to three lines; otherwise the text is cut off.</dd>
                <dt>Always shown</dt>
                <dd>Users can't hide the column with Choose columns.</dd>
                <dt>Width</dt>
                <dd>
                    A starting width in pixels. Auto sizes the column to its type and values. A column is never narrower
                    than its type needs, and users can resize it for themselves.
                </dd>
                <dt>Group, Subtotal</dt>
                <dd>
                    Group opens the grid grouped by this column, 1 being the outermost grouping. Users can group offers
                    grouping in the column's menu. Subtotal is what each group and the Total row show for it.
                </dd>
                <dt>Formula column</dt>
                <dd>
                    Worked out from other fields, in the syntax of a formula field. Read-only. At most 10 formulas a
                    grid, columns and display rules together.
                </dd>
                <dt>Child total column</dt>
                <dd>
                    A count, sum, average, min or max of each row's records in a child table, such as an account's
                    contacts. Read-only; at most five a grid. Offered once the grid has a saved child table.
                </dd>
            </dl>
            <div class="rh-call">
                <span class="rh-call-k">Tip</span>
                <p>A saved column can't be deleted. Switch it off; it stays in Setup.</p>
            </div>
        </template>

        <template lwc:elseif={isRules}>
            <p>
                One per highlight: a fill, a text color, bold, an icon or a data bar, when a field meets a condition or
                a formula is true.
            </p>
            <dl class="rh-help-list">
                <dt>Meaning</dt>
                <dd>What the highlight means, as the Display Key shows it to users.</dd>
                <dt>Condition</dt>
                <dd>
                    Equals, greater than, Between and the rest; a field compared with another field of the record; or
                    Formula is true.
                </dd>
                <dt>Look, Applies to</dt>
                <dd>The highlight, on the cell or on the whole row.</dd>
                <dt>When two rules meet</dt>
                <dd>
                    Rules apply top to bottom. For each of the fill, text color, bold, icon and data bar, the first
                    matching rule wins.
                </dd>
            </dl>
            <div class="rh-call">
                <span class="rh-call-k">Tip</span>
                <p>
                    Rules follow an edit before it's saved. A formula rule is worked out on the server, so it changes
                    after a save.
                </p>
            </div>
        </template>

        <template lwc:elseif={isFilters}>
            <p>
                One per condition every row must meet. Users see the filters as locked chips above the grid and can't
                remove them.
            </p>
            <dl class="rh-help-list">
                <dt>Label</dt>
                <dd>
                    The filter's name, in Setup and in any message about it. Blank makes one from the condition. The chip
                    shows the condition itself.
                </dd>
                <dt>Condition, Value</dt>
                <dd>
                    A picklist value by label or API name, a date as 2026-12-31 or TODAY-30, a lookup as a record Id or
                    $User for "my records".
                </dd>
                <dt>A filter that can't work</dt>
                <dd>Stops the grid with a message naming it. It is never skipped.</dd>
                <dt>Not security</dt>
                <dd>Who can see a record is still decided by sharing and field-level security.</dd>
            </dl>
            <div class="rh-call">
                <span class="rh-call-k">Tip</span>
                <p>
                    Users add their own from a column's menu or the Filters panel, with their own filter logic, and a
                    saved view keeps them. Yours always apply under theirs.
                </p>
            </div>
        </template>

        <template lwc:elseif={isActions}>
            <p>
                One per action users can run on a row, or on the rows they select. Its label is what the menu item says.
            </p>
            <dl class="rh-help-list">
                <dt>Type: a screen flow</dt>
                <dd>
                    Opens on a page of its own, as the user, then comes back to the grid. It gets the row's Id in
                    recordId, or the selected rows' Ids in ids.
                </dd>
                <dt>Type: an autolaunched flow</dt>
                <dd>
                    Runs on the server, one interview per record, 50 records per call. To run Apex, call it from an
                    autolaunched flow.
                </dd>
                <dt>Type: a quick action</dt>
                <dd>
                    Opens in Salesforce's own window over the grid, for one row, then the row is read again. It's
                    offered in each row's menu only.
                </dd>
                <dt>Runs</dt>
                <dd>
                    The flow's API name, or the quick action's: Account.NewCase for an object's, LogACall for a global
                    one.
                </dd>
                <dt>Input</dt>
                <dd>The flow's input that gets the record Id. Blank is recordId.</dd>
                <dt>Offered in</dt>
                <dd>Each row's menu, the selection bar, or both.</dd>
                <dt>Asks first</dt>
                <dd>
                    A question before an autolaunched flow runs, such as Send the renewal quote? Blank still asks
                    before a run on selected rows, naming them.
                </dd>
                <dt>Permission</dt>
                <dd>
                    A custom permission's API name: your own, or another package's with its prefix. Only users who
                    hold it see and run the action. Required for an autolaunched flow.
                </dd>
            </dl>
            <div class="rh-call rh-call_warn">
                <span class="rh-call-k">Access</span>
                <p>
                    Rowhouse doesn't check access to the flow itself, and an autolaunched flow runs in system context
                    by default. So an autolaunched flow runs only for the people who hold its Required Permission.
                </p>
            </div>
        </template>

        <template lwc:elseif={isChildren}>
            <p>
                One per tab under each row: a full grid of its own configuration, showing the records whose lookup
                points to that row.
            </p>
            <dl class="rh-help-list">
                <dt>Grid</dt>
                <dd>
                    The child grid: build it first, for the child object, like any other grid. It need not be on any
                    page.
                </dd>
                <dt>Linked by</dt>
                <dd>The child object's lookup to this grid's object.</dd>
                <dt>Tab label</dt>
                <dd>The tab's name. Blank uses the child grid's title.</dd>
                <dt>Height</dt>
                <dd>
                    How tall the child grid can be, in pixels, at least 160. Standard: 388 under a row, 168 one level
                    down. Fewer records take less room; more scroll inside.
                </dd>
                <dt>Three levels at most</dt>
                <dd>A grid, its child tables, and theirs.</dd>
            </dl>
            <div class="rh-call">
                <span class="rh-call-k">Tip</span>
                <p>
                    Everything the child grid allows works in the tab. An import there fills in the parent on every new
                    record.
                </p>
            </div>
        </template>
        <template lwc:elseif={isViews}>
            <p>
                A view is a named way of looking at a grid, as a list view is: its columns, grouping, filters and chart.
                Users save their own and pick them from the grid's title.
            </p>
            <dl class="rh-help-list">
                <dt>Who sees a view</dt>
                <dd>
                    Its owner alone, unless they share it with all users or with roles and public groups. Sharing needs
                    Salesforce's Manage Public List Views permission.
                </dd>
                <dt>Changing a view</dt>
                <dd>Only its owner can. Anyone who sees it can save a copy as their own.</dd>
                <dt>Deleting</dt>
                <dd>You can delete any view here. Its owner can delete it from the grid.</dd>
                <dt>Your grid underneath</dt>
                <dd>
                    Your filters and a record page's record still apply to every view, so a view only narrows the grid.
                    Child tables have no views.
                </dd>
            </dl>
        </template>
    </section>
</template>
