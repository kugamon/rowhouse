            <li style="break-inside:avoid"><b>The grid's icon and title.</b> Your admin names each grid. The title is also the view picker: its ▾ lists the grid's <a href="#views" data-anchor-link="views">saved views</a>, and the pin beside it marks the one the grid opens on for you.</li>

        <section id="find" data-anchor="find">
          <div class="rh-sec-head"><span class="rh-sec-num">Basics</span><h2>Find and sort</h2></div>
          <div class="rh-split">
            <div>
              <h4 class="rh-mt0">Search</h4>
              <p>Type in <b>Search this list</b>. The grid searches every record it can show, not only the rows on screen: the text, email, phone, web address and picklist fields it reads (its columns, and any field a display rule needs), and the names in lookup columns, anywhere in the value. Numbers, dates, long text and multi-select picklists are not searched. Click in the box and a note under it names the columns it does not look in, as a list view's does; on Service Triage, <span class="rh-v rh-plain">Opened isn't searchable. Use filters or sort on this field instead.</span> Clear the box to see everything again.</p>
              <h4>Sort</h4>
              <p>Click a column's header to sort by it; click again to reverse. <b>Shift-click</b> another header to sort by it as well, as a tie-breaker. Each column's ▾ menu also has <b>Sort ascending</b> and <b>Sort descending</b>. A picklist sorts in the order of its values, as Salesforce lists them, not alphabetically.</p>
              <h4>Filter</h4>
              <p>Open a column's ▾ menu and choose <b>Filter…</b>. Pick a condition (for a date: On, After, Before, Between…), enter a value, and click <b>Apply</b> or press <kbd>Enter</kbd>. The grid asks Salesforce again, so the count, the groups and the totals are of the filtered records. The column's header shows a filter icon, and the filter shows as a chip under the title: its ✕ removes it, and <b>Clear filters</b> removes all of yours. <b>Edit filter…</b> in the menu changes it, and <b>Remove filter</b> removes it. When nothing matches, the grid says so and offers <b>Clear search</b> or <b>Clear filters</b>; an empty grid that takes imports offers <b>Import</b>. Up to 10 filters. On the grid as your admin set it up, your filters last until you leave or reload the page; a <a href="#views" data-anchor-link="views">saved view</a> keeps its filters.</p>
              <h4>The Filters panel, and OR</h4>
              <p>Click <b>Filters</b>, the funnel after the Display Key (in a narrow space, <b>Filters</b> in the menu beside the search). The panel beside the list shows your admin's filters, locked, then yours, numbered. Click one to change it, or its bin to remove it, or <b>Remove All</b> to clear yours; <b>Add Filter</b> asks for a column, then a condition and a value, and <b>Done</b> adds it. A column can have more than one here: Stage equals Prospecting, and Stage equals Qualification. <b>Add Filter Logic</b> joins them by number with AND, OR and NOT, with parentheses, such as <span class="rh-v rh-plain">1 AND (2 OR 3)</span>; AND and OR side by side need parentheses, and every filter must be in it; <b>Remove</b>, beside it, takes the logic away. Nothing changes until you click <b>Apply</b>; <b>Cancel</b> puts the panel back. Your admin's filters still apply to every record, so OR never shows what they keep out.</p>
              <p>A lookup is filtered by the name of its record ("Name contains acme"), and a lookup to people also by <b>Is me</b>. Long text and formula columns cannot be filtered.</p>
            </div>
            <div>
              <h4 class="rh-mt0">Big lists</h4>
              <p>The grid loads the first 10,000 records straight away, so sorting them is instant. Past that, more load as you scroll toward the end, 2,000 at a time, up to 100,000; a <b>Load more rows</b> button below the grid does the same. In a list that big, sorting asks Salesforce for the records in the new order, which takes a few seconds. Salesforce orders them by the first column you sorted; a tie-breaker then orders the rows that are loaded. When more than 100,000 records match, the count above the grid says how many (<i>10,000 of 110,000 items</i>) and a search or filter brings the rest within reach.</p>

        <section id="edit" data-anchor="edit">
          <div class="rh-sec-head"><span class="rh-sec-num">Basics</span><h2>Edit and save</h2>
          <p class="rh-sec-sub">Hover over a cell: a blue pencil means you can change it, a gray lock means you cannot.</p></div>
          <div class="rh-tiles rh-rv-stagger">
            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></div><h4>Start typing</h4><p>On a focused cell, just type: your first character replaces the value, as in a spreadsheet.</p></div>
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></div><h4>Or open the editor</h4><p>Press <kbd>Enter</kbd> or <kbd>F2</kbd>, double-click the cell, or click the pencil. The editor opens with the current value, so you can change part of it.</p></div>
            <div class="rh-tile rh-plum"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div><h4>Finish</h4><p><kbd>Enter</kbd> or <kbd>Tab</kbd> keeps the change; <kbd>Esc</kbd> leaves the cell as it was.</p></div>
            <div class="rh-tile rh-gold"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div><h4>Save</h4><p>The cell turns yellow and the Save bar appears. Click <b>Save</b> when you are ready, or <b>Cancel</b> to throw every change away.</p></div>
          </div>
          <h3>The editors</h3>
          <div class="rh-tbox"><table class="rh-ref">
            <thead><tr><th>Field type</th><th>How you edit it</th></tr></thead>
            <tbody>
              <tr><td>Text, email, phone, web address</td><td>Type. A required field left empty is refused in the editor with "Complete this field."</td></tr>
              <tr><td>Number, currency, percent</td><td>Type the number. It is rounded to the field's decimal places straight away, so you see exactly what will be saved.</td></tr>
              <tr><td>Date/time</td><td>The same calendar, with a list of times every half hour and <b>Now</b>; or type the date and time ("10/2/2026 3:30 PM") and press <kbd>Enter</kbd>. The time is in your Salesforce time zone, named under the calendar.</td></tr>
              <tr><td>Time</td><td>Pick from the list of times every half hour, or type <span class="rh-v rh-plain">17:30</span>, <span class="rh-v rh-plain">5:30 PM</span> or <span class="rh-v rh-plain">5pm</span> and press <kbd>Enter</kbd>.</td></tr>
              <tr><td>Long text</td><td>A text area opens under the cell, with a count of characters against the field's limit. <kbd>Enter</kbd> starts a new line; <kbd>Ctrl</kbd>+<kbd>Enter</kbd> (<kbd>⌘</kbd>+<kbd>Enter</kbd> on a Mac), <kbd>Tab</kbd> or <b>Done</b> keeps it. A very long value is read whole first, so what you save is never a shortened copy.</td></tr>
              <tr><td>Date</td><td>A calendar opens with the editor. Click a day, or type the date in the box and press <kbd>Enter</kbd>. <kbd>↓</kbd> moves into the calendar: arrows by day and week, <kbd>Page Up</kbd>/<kbd>Page Down</kbd> by month (with <kbd>Shift</kbd>, by year), <kbd>Enter</kbd> picks. <b>Today</b> picks today.</td></tr>
              <tr><td>Checkbox</td><td><kbd>Space</kbd> or a click selects or deselects it, and the change is kept at once.</td></tr>
              <tr><td>Picklist</td><td>Choose from the list. It offers the values the record's record type allows, as the record page does. A dependent picklist offers only the values its controlling field allows; changing the controlling value clears a value it no longer allows, and says so.</td></tr>
              <tr><td>Multi-select picklist</td><td>Move values between Available and Chosen, then click <b>Done</b>.</td></tr>
              <tr><td>Lookup and owner</td><td>Type part of a name; matches appear after a moment. Arrow to one and press <kbd>Enter</kbd>. Empty the box to clear the field. An owner can be a user or a queue. <b>New Account</b> (or the lookup's object) at the end of the list opens Salesforce's own form; the record you save goes in the cell. A lookup your admin limited with a lookup filter opens Salesforce's own lookup, which offers only the records the filter allows.</td></tr>
            </tbody></table></div>

          <h3 id="new" data-anchor="new">Add a record</h3>
          <p>When your admin allows it, a <b>New</b> button sits above the grid. Click it and a row appears at the top of the grid, saying <b>New</b> where a row number goes, with Salesforce's defaults already filled in, such as you as the owner. Fill in its cells as you would any row's; a gray lock is a field that cannot be set on a new record. <b>Save</b> creates the record with your other changes; it stays at the top, where you can see it, until the grid is next sorted or refreshed. <b>Undo</b> takes the row away again; <b>Cancel</b> takes away every new row.</p>
          <p>When a new record needs more than the grid shows, such as a required field that is not a column or a choice of record type, <b>New</b> opens Salesforce's own New form instead. The record you save there appears at the top of the grid.</p>
          <h3 id="related-field" data-anchor="related-field">A field of a related record</h3>
          <p>A column can show a field of a related record, such as the industry of a contact's account, headed as a report heads it: <span class="rh-v rh-plain">Account: Industry</span>. Changing it changes the account, so every row with the same account shows the new value at once. That is one change, which one <b>Undo</b> takes back, and <b>Save</b> writes it to the account once. A row with no account shows a gray lock in that column. If two rows give the same account different values, neither is saved, and both cells say why.</p>

          <h3>While it saves, and after</h3>
          <div class="rh-split">
            <ul class="rh-tick">
              <li><b>Big saves go in batches</b> and the grid says how far it has got ("Saving… 3 of 5 batches done").</li>
              <li><b>Saved rows are read back</b>, so formula fields and anything your company's automation changed show their new values.</li>
            </ul>
            <ul class="rh-tick">
              <li><b>If Salesforce refuses a change</b>, for example a validation rule, the cell is marked and keeps your value; move to it to read why. The other records still save.</li>
              <li><b>Before you leave the page</b>, Save or Cancel: unsaved edits are not kept for later. While there are any, reloading or closing the page asks first, in your browser's own words (Chrome: <i>Leave site?</i> or <i>Reload site?</i>). Moving to another tab in Salesforce asks nothing: Salesforce keeps the page, and the grid has them when you come back.</li>
            </ul>
          </div>
        </section>

        <section id="keys" data-anchor="keys">
          <div class="rh-sec-head"><span class="rh-sec-num">Basics</span><h2>Keys</h2>
          <p class="rh-sec-sub">One <kbd>Tab</kbd> takes you into the grid, and one more takes you out. Inside, the arrow keys move. On a Mac, <kbd>Cmd</kbd> where this says Ctrl; redo is <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>.</p></div>
          <div class="rh-frame rh-rv">
            <div class="rh-split" style="align-items:center">
              <div class="rh-kdemo" aria-hidden="true">
                <div class="rh-kgrid">
                  <span>Account</span><span>Stage</span><span>Amount</span>
                  <span>GenePoint</span><span>Prospecting</span><span>$60,000</span>
                  <span>Edge</span><span>Negotiation</span><span class="rh-kv"><b>$95,000</b><em>$98,000</em></span>
                </div>
                <div class="rh-kfocus"></div>
              </div>
              <div class="rh-keyboard" aria-hidden="true">
                <div class="rh-row"><span class="rh-k rh-kd-f2">F2</span><span class="rh-k rh-w rh-kd-enter">Enter ⏎</span></div>
                <div class="rh-row"><span class="rh-k">←</span><span class="rh-k rh-kd-down">↓</span><span class="rh-k rh-kd-right">→</span></div>
                <div class="rh-row"><span class="rh-k rh-xw rh-kd-type">9 8 0 0 0</span></div>
              </div>
            </div>
            <p class="rh-chart-note">→ → ↓ to reach Amount, type 98000, Enter: the cell turns yellow, waiting for Save.</p>
          </div>
          <div class="rh-kb" style="margin-top:22px">
            <div>
              <h4 class="rh-mt0">Moving</h4>
              <div class="rh-kbrow"><span>One cell</span><span class="rh-keys"><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd></span></div>
              <div class="rh-kbrow"><span>Start or end of the row</span><span class="rh-keys"><kbd>Home</kbd> <kbd>End</kbd></span></div>
              <div class="rh-kbrow"><span>First or last cell of the grid</span><span class="rh-keys"><kbd>Ctrl</kbd>+<kbd>Home</kbd> <kbd>Ctrl</kbd>+<kbd>End</kbd></span></div>
              <div class="rh-kbrow"><span>A screenful up or down</span><span class="rh-keys"><kbd>Page Up</kbd> <kbd>Page Down</kbd></span></div>
              <div class="rh-kbrow"><span>Down to the Total row</span><span class="rh-keys"><kbd>↓</kbd> from the last row</span></div>
              <div class="rh-kbrow"><span>Into or out of the grid</span><span class="rh-keys"><kbd>Tab</kbd> <kbd>Shift</kbd>+<kbd>Tab</kbd></span></div>
            </div>
            <div>
              <h4 class="rh-mt0">Editing</h4>
              <div class="rh-kbrow"><span>Replace the value</span><span class="rh-keys">just type</span></div>
              <div class="rh-kbrow"><span>Open the editor</span><span class="rh-keys"><kbd>Enter</kbd> <kbd>F2</kbd>; <kbd>F2</kbd> where the value is a link</span></div>
              <div class="rh-kbrow"><span>Keep the change</span><span class="rh-keys"><kbd>Enter</kbd> <kbd>Tab</kbd></span></div>
              <div class="rh-kbrow"><span>Keep it on every selected row</span><span class="rh-keys"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span></div>
              <div class="rh-kbrow"><span>Leave the cell as it was</span><span class="rh-keys"><kbd>Esc</kbd></span></div>
              <div class="rh-kbrow"><span>Use a link or button in a cell</span><span class="rh-keys"><kbd>Enter</kbd>, then <kbd>Tab</kbd> to the next; <kbd>Esc</kbd> to return</span></div>
            </div>
            <div>
              <h4 class="rh-mt0">Headers and rows</h4>
              <div class="rh-kbrow"><span>Sort by the column</span><span class="rh-keys"><kbd>Space</kbd> on its header</span></div>
              <div class="rh-kbrow"><span>Add it to the sort</span><span class="rh-keys"><kbd>Shift</kbd>+<kbd>Space</kbd></span></div>
              <div class="rh-kbrow"><span>Resize the column, 10 pixels a press</span><span class="rh-keys"><kbd>Enter</kbd> on its header, <kbd>Tab</kbd> to its width, <kbd>←</kbd> <kbd>→</kbd></span></div>
              <div class="rh-kbrow"><span>Select or deselect the row</span><span class="rh-keys"><kbd>Space</kbd> on a cell</span></div>
              <div class="rh-kbrow"><span>Open a row's actions</span><span class="rh-keys"><kbd>End</kbd>, then <kbd>Enter</kbd></span></div>
              <div class="rh-kbrow"><span>Open or close related records</span><span class="rh-keys"><kbd>Enter</kbd> on the toggle</span></div>
            </div>
            <div>
              <h4 class="rh-mt0">Ranges and clipboard</h4>
              <div class="rh-kbrow"><span>Extend a range</span><span class="rh-keys"><kbd>Shift</kbd>+arrows, or <kbd>Shift</kbd>-click</span></div>
              <div class="rh-kbrow"><span>Copy · Paste</span><span class="rh-keys"><kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div>
              <div class="rh-kbrow"><span>Fill down</span><span class="rh-keys"><kbd>Ctrl</kbd>+<kbd>D</kbd></span></div>
              <div class="rh-kbrow"><span>Clear the range</span><span class="rh-keys"><kbd>Delete</kbd> <kbd>Backspace</kbd></span></div>
              <div class="rh-kbrow"><span>Undo · Redo</span><span class="rh-keys"><kbd>Ctrl</kbd>+<kbd>Z</kbd> · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> or <kbd>Ctrl</kbd>+<kbd>Y</kbd></span></div>
            </div>
          </div>
        </section>

        <section id="sheet" data-anchor="sheet">
          <div class="rh-sec-head"><span class="rh-sec-num">Basics</span><h2>Copy, paste, fill down, undo</h2>
          <p class="rh-sec-sub">All of it works on unsaved edits, so every step can be undone, and Cancel throws it all away.</p></div>
          <div class="rh-tiles rh-rv-stagger">
            <div class="rh-tile"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></svg></div><h4>Select a range</h4><p>Hold <kbd>Shift</kbd> and use the arrows, or Shift-click a cell. Any move without Shift goes back to one cell. Sorting clears the range.</p></div>
            <div class="rh-tile rh-sky"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></div><h4>Copy</h4><p>Copies tab-separated text that Excel and Google Sheets paste as cells: numbers plain, dates as 2026-10-15, checkboxes as TRUE or FALSE.</p></div>
            <div class="rh-tile rh-plum"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div><h4>Paste</h4><p>Paste a block from a spreadsheet, up to 10,000 cells. One value into a range fills it. Read-only cells are skipped and counted; a value that does not fit a column is marked on its cell.</p></div>
            <div class="rh-tile rh-gold"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></div><h4>Fill down</h4><p><kbd>Ctrl</kbd>+<kbd>D</kbd> copies the top row of the range into the rows below it; on one cell, it copies the cell above.</p></div>
            <div class="rh-tile rh-rose"><div class="rh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></div><h4>Undo and redo</h4><p>Up to 100 steps, with the keys or the Save bar's buttons. A paste of 500 cells is one step. Saving clears the history.</p></div>
          </div>
          <div class="rh-call rh-s" style="margin-top:20px"><span class="rh-k">Pasting lookups and picklists</span><p>Paste a record Id or a record's name. A name the grid does not show is looked up in Salesforce, among the records the field can point to. A name two records share is refused, and asks for the Id. A picklist value the record's record type does not offer is refused on its cell, when you paste it or fill it down.</p></div>
        </section>

        <section id="select" data-anchor="select">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Change many rows at once</h2></div>
          <figure class="rh-rv">
            <div class="rh-screen"><div class="rh-stage"><div class="rh-card-m" style="min-height:190px">
              <div class="rh-m-head"><div class="rh-m-ico rh-case"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM8 4h8v2H8z"/></svg></div><div><div class="rh-m-title">Service Triage<span class="rh-m-caret" aria-hidden="true">▾</span><span class="rh-m-pin" title="This view is pinned."><svg viewBox="0 0 24 24"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-5-5 5-1-1 5-5-5-4 2-2 5 1 4-4z"/></svg></span></div><div class="rh-m-meta">35 items • Sorted by Opened • Updated a few seconds ago</div></div><div class="rh-m-tools"><div class="rh-m-search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Search this list…</div><div class="rh-m-ibtn rh-m-gearmenu" title="View Controls"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div><div class="rh-m-ibtn" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></div><div class="rh-m-ibtn" title="Choose columns"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M12 5v14"/><path d="M18 5v14"/></svg></div><div class="rh-m-ibtn" title="Charts"><svg viewBox="0 0 24 24"><path d="M11 3.5a8.5 8.5 0 1 0 9.5 9.5H11z"/><path d="M14 2.5a7.5 7.5 0 0 1 7.5 7.5H14z"/></svg></div><div class="rh-m-ibtn" title="Display Key"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7"/></svg></div><div class="rh-m-ibtn" title="Filters"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg></div><div class="rh-m-ibtn" title="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg></div><div class="rh-m-btn">New</div><div class="rh-m-btn">Export</div></div></div>
              <div class="rh-m-selbar"><b>3 selected</b><span class="rh-mb"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Update field</span><span class="rh-m-link">Clear</span></div>
              <table class="rh-mt"><colgroup><col style="width:7%"><col style="width:5%"><col style="width:15%"><col style="width:43%"><col style="width:30%"></colgroup><thead><tr><th class="rh-rn"></th><th class="rh-cb"><span class="rh-mcb"></span></th><th class="rh-dd">Case</th><th class="rh-dd">Subject</th><th class="rh-dd">Status</th></tr></thead><tbody>
                <tr class="rh-sel"><td class="rh-rn">1</td><td class="rh-cb"><span class="rh-mcb rh-on"></span></td><td class="rh-lnk">00001026</td><td>Generator GC1060 trips on start-up</td><td>New</td></tr>
                <tr class="rh-sel"><td class="rh-rn">2</td><td class="rh-cb"><span class="rh-mcb rh-on"></span></td><td class="rh-lnk">00001027</td><td>Portal login loops back to sign-in</td><td>New</td></tr>
                <tr class="rh-sel"><td class="rh-rn">3</td><td class="rh-cb"><span class="rh-mcb rh-on"></span></td><td class="rh-lnk">00001028</td><td>Shipment of spare filters arrived damaged</td><td>New</td></tr>
                <tr><td class="rh-rn">4</td><td class="rh-cb"><span class="rh-mcb"></span></td><td class="rh-lnk">00001029</td><td>Invoice shows the wrong tax rate</td><td>Working</td></tr>
              </tbody></table>
            </div></div></div>
            <figcaption>Select rows (or press Space on them): a bar floats over the top of the grid with what you can do to all of them. Here, <b>Update field</b>; Delete and your admin's actions join it when the grid has them.</figcaption>
          </figure>
          <ul class="rh-tick">
            <li><b>Update field</b> sets one column to one value on every selected row: in <b>Change 3 selected rows</b>, choose the <b>Field</b>, enter the value and click <b>Apply</b>. A picklist offers the values every selected row's record type allows. The changes wait as unsaved edits; check them, then <b>Save</b>.</li>
            <li id="bulk-edit" data-anchor="bulk-edit"><b>Or edit a cell of one of them.</b> With two or more rows selected, the editor on a selected row has a box under it, <b>Update 3 selected items</b>, not selected. Select it, then keep the change, and every selected row gets the value, as Update field gives it; or press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> (<kbd>⌘</kbd>+<kbd>Enter</kbd> on a Mac) to do the same without the box. In a long text editor, <kbd>Ctrl</kbd>+<kbd>Enter</kbd> keeps the text in its own cell, so use the box there. One <b>Undo</b> takes back the whole change.</li>
            <li><b>Delete</b>, when your admin allows it, asks first, naming the rows. Deleted records go to the Recycle Bin, and a bar under the grid's header offers <b>Undo</b>, which puts them back.</li>
            <li><b>Actions</b> your admin added for selections show as buttons, or in an Actions menu.</li>
            <li><b>Select all</b> (the box in the header) takes up to 10,000 rows in the current order. When every loaded row is selected and more records match, up to 50,000, a grid that allows Delete offers <b>Select all N matching records</b>: Delete then deletes every record the search and filters match, while Update field and actions still work on the loaded rows. Salesforce's Recycle Bin holds a limited number of records, and once it is full it removes the oldest that have been there two hours or more, so if a large delete was a mistake, click Undo straight away. <b>Clear</b> deselects everything. A search or a reload clears the selection, and a save keeps it. A sort keeps it too when every matching record is loaded; when more match, a sort, a filter or a change of grouping loads the rows again and clears it.</li>
          </ul>
        </section>

        <section id="group" data-anchor="group">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Group and total</h2></div>
          <div class="rh-split">
            <ul class="rh-tick">
              <li><b>Group by a column</b> from its ▾ menu: <b>Group by Stage</b>. Once grouped, other columns offer <b>Add … to grouping</b> (up to three levels) and <b>Group by … only</b>. Or drag a column's header onto the drop zone above the table, or onto the Group column.</li>
              <li><b>Each group</b> shows its count and subtotals. Click its arrow, or press <kbd>Enter</kbd> on it, to close or open it; the Group column's menu has <b>Expand all groups</b> and <b>Collapse all groups</b>.</li>
              <li><b>Dates</b> group by month unless you choose day, week, quarter, year, fiscal quarter or fiscal year in the Group column's menu.</li>
              <li><b>Order and share:</b> the Group column's menu orders the groups by name, by record count or by a subtotal (largest or smallest first), and <b>Show percent of total</b> adds each group's share.</li>
              <li><b>Groups come in the order a Salesforce report uses:</b> a picklist in its own order of values (Prospecting before Closed Won), dates and numbers from low to high, Not checked before Checked, everything else A to Z, blank last. Sort the column descending to reverse them.</li>
            </ul>
            <ul class="rh-tick">
              <li><b>Chips above the grid</b> show the grouping; the ✕ on a chip removes that level, and <b>Stop grouping</b> removes all of them.</li>
              <li><b>The Total row</b> at the bottom adds up every matching record, not just the rows on screen. Press <kbd>↓</kbd> on the last row to reach it, and <kbd>←</kbd> <kbd>→</kbd> to move along its totals.</li>
              <li><b>Subtotals follow your edits</b> before you save, marked yellow. An edited row moves to its new group when you save.</li>
            </ul>
          </div>
        </section>

        <section id="charts" data-anchor="charts">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Charts</h2>
          <p class="rh-sec-sub">As on a list view: a chart of every record the search and filters match, beside the list.</p></div>
          <figure class="rh-rv">

            <li><b>Change what it shows.</b> Click the gear, then <span class="rh-ui">Edit chart</span>. Choose a <span class="rh-ui">Chart type</span>, one of the five. Choose the <span class="rh-ui">Measure</span>: <span class="rh-ui">Record count</span>, <span class="rh-ui">Sum of</span> or <span class="rh-ui">Average of</span>, and for a sum or an average the <span class="rh-ui">Field</span>, a number column. Choose what to <span class="rh-ui">Group by</span>: any column the grid can group by, a date by month, quarter or year. For stacked bars, choose what to <span class="rh-ui">Stack by</span>: a second column, whose groups stack within each bar. Click <span class="rh-ui">Save</span>.<div class="rh-check">The title says what it shows. On Pipeline Review, with <span class="rh-ui">Sum of</span>, <span class="rh-ui">Amount</span> and <span class="rh-ui">Close Date (Month)</span>: <span class="rh-v rh-plain">Sum of Amount by Close Date (Month)</span>. With <span class="rh-ui">Stacked vertical bar</span> and <span class="rh-ui">Stack by</span> <span class="rh-ui">Stage</span>: <span class="rh-v rh-plain">Sum of Amount by Close Date (Month) and Stage</span>, with a key to the stages' colors above the bars.</div></li>
            <li><b>Point at a bar.</b> Rest the pointer on a bar, a stack in a bar, or a slice of a donut: a tooltip gives its group, its figure and, for a count or a sum, its share of the total.<div class="rh-check">On the stacked chart, on September 2024: <span class="rh-v rh-plain">Close Date: September 2024</span>, <span class="rh-v rh-plain">Stage: Closed Won</span>, <span class="rh-v rh-plain">Sum of Amount: $3,645,000.00</span>, <span class="rh-v rh-plain">63.3% of $5,760,000.00</span>.</div></li>

        <section id="related" data-anchor="related">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Related records</h2>
          <p class="rh-sec-sub">When your admin has added child tables, a row with related records has a toggle showing how many. Open it to see them in tabs below the row.</p></div>
          <ul class="rh-tick">
            <li><b>Each tab is a grid of its own</b>, with its own columns, sort, editing and Save bar. Its changes are saved separately from the main grid's.</li>
            <li><b>From the keyboard:</b> <kbd>Enter</kbd> on the toggle opens the row; arrow down to the panel and press <kbd>Enter</kbd> to go into the tab's grid; <kbd>Esc</kbd> comes back out.</li>
            <li><b>Importing into a tab</b> links every new record to the row automatically.</li>
            <li><b>Open every row at once</b> with the button in the toggle column's header (up to the first 200 rows with related records); it closes them again.</li>
          </ul>
        </section>

        <section id="actions" data-anchor="actions">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Actions</h2></div>
          <div class="rh-split">
            <ul class="rh-tick">
              <li><b>On one row:</b> open the ▾ menu at the right end of the row and choose the action. Most run straight away; some ask a question first.</li>
              <li id="row-menu" data-anchor="row-menu"><b>Edit, Delete and Change Owner</b> come first in the menu, as on a list view, when you may. <b>Edit</b> opens Salesforce's own edit form for the record, with every field of its page layout, and saves it there; the row then shows the saved values. <b>Delete</b> asks first, naming the row; the record goes to the Recycle Bin, and <b>Undo</b> puts it back. <b>Change Owner</b> asks for a user or a queue and saves the new owner at once, without the Save bar. Save or cancel a row's changes before you edit it or change its owner: the grid asks you to.</li>
              <li><b>On many rows:</b> select them, then use the action's button in the selection bar. You are asked first, except for a screen flow, which opens on its own page.</li>
            </ul>
            <ul class="rh-tick">
              <li><b>A screen flow</b> opens on a page of its own, under the action's name, with a <b>Cancel</b> button at the top. Finish it, or click Cancel, and you are back on the grid with those rows read again. Save or cancel your changes in the grid first: the grid asks you to.</li>
              <li id="quick-action" data-anchor="quick-action"><b>A quick action</b>, such as Log a Call, opens Salesforce's own window over the grid, for that row's record. Save or Cancel it, and the row is read again. Save or cancel that row's changes first: the grid asks you to.</li>
              <li><b>Afterwards</b> a message says how many records it ran on, and any record it could not run on shows why on its row.</li>
            </ul>
          </div>
        </section>

        <section id="io" data-anchor="io">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Import and export</h2></div>
          <div class="rh-split">
            <div>
              <h4 class="rh-mt0">Export</h4>
              <p><b>Click Export</b>, choose the <b>Export View</b>, as for a Salesforce report, and click <b>Export</b>. Every record that matches the grid's filters and your search goes in, up to 100,000; the rows not yet loaded load first, and the dialog shows how far it has got.</p>
              <figure class="rh-rv" style="max-width:520px">
                <div class="rh-screen"><div class="rh-stage"><div class="rh-card-m rh-m-modal">
                  <div class="rh-m-modal-h">Export</div>
                  <span class="rh-m-xlabel">Export View</span>
                  <div class="rh-m-xviews">
                    <div class="rh-m-xcard rh-on"><b>Formatted Report</b>Export the report, including the report header, groupings, and filter settings.</div>
                    <div class="rh-m-xcard"><b>Details Only</b>Export only the detail rows. Use this to do further calculations or for uploading to other systems.</div>
                  </div>
                  <div class="rh-m-xfields"><div><span class="rh-lb">Format</span><span class="rh-sel rh-off">Excel Format .xlsx</span></div></div>
                  <div class="rh-m-modal-f"><span class="rh-m-btn">Cancel</span><span class="rh-m-btn rh-pr">Export</span></div>
                </div></div></div>
                <figcaption>Export on Pipeline Review. A Formatted Report is an Excel workbook; Details Only is an Excel workbook or a CSV.</figcaption>
              </figure>
              <ul class="rh-tick">
                <li><b>Formatted Report</b>, the grid as it looks, under the report's header as Salesforce writes it: the grid's name; <b>As of</b> the date and time, <b>Generated by</b> you, and <b>Sorted by</b> your sort; then <b>Filtered By</b> and each filter; under the table, "Confidential Information - Do Not Distribute" and "Made with Rowhouse Grid by Kugamon". Numbers, amounts, percents and dates stay numbers and dates, formatted as the grid shows them; checkboxes are TRUE or FALSE; lookups and picklists show their names. You get the columns you see, in your order and at their widths, under a bold header (with filter buttons when the grid is not grouped, and the Total row kept below them), with your frozen columns frozen and wrapped columns wrapped, and the fills, text colors and bold of the grid's display rules (not their icons or data bars). A grouped grid gives each group a heading row and a <b>Subtotal</b> row, which Excel's outline buttons fold, and ends with a <b>Total</b> row; they add up the rows in the file, as formulas.</li>
                <li><b>Details Only</b>, each row without formatting, for calculations or to import back. Under <b>Format</b>, choose <b>Excel Format .xlsx</b> or <b>Comma Delimited .csv</b> (Unicode, UTF-8). The record Id comes first; lookups show their record's name and picklists their labels, as a report's export does.</li>
              </ul>
              <p>An export holds saved values: unsaved edits are left out. A very long text exports as the grid shows it, its first 1,000 characters and "…"; imported back unchanged, it leaves the whole text as it was. To change records in a spreadsheet and bring them back, export <b>Details Only</b>: a Formatted Report has no record Id. Your admin can offer Export only to people with Salesforce's <b>Export Reports</b> permission.</p>
            </div>
            <div>
              <h4 class="rh-mt0">Import</h4>
              <ol class="rh-steps">
                <li><b>Save or cancel</b> any changes first.</li>
                <li><b>Click Import</b> and drop in a CSV or Excel (.xlsx) file. (Import shows only on a grid your admin set up both for new records and for editing cells.) The first row must name the columns, as the grid does. <b>Download a template with this grid's columns</b> gives you a file with the right headers.</li>
                <li><b>Check the rows</b>: how many records will be updated, how many created, and any rows held back, with the reason. For a workbook, choose the <b>Sheet</b>. Under <b>Columns</b>, change what a file column is imported as, or choose <b>(Not imported)</b>.</li>
                <li><b>Click Import N rows.</b> When it is done, <b>Undo import</b> puts back what it changed, until you close the dialog. Close it and the grid reloads with your changes.</li>
              </ol>
              <p class="rh-note">A row with an Id updates that record; a row without one creates a new record, if you can create records of that kind. With an External Id column in the file, <b>Match records by</b> can match by it instead. An empty cell clears the field; to leave a field alone, leave its column out. A lookup column can hold record Ids or names: a name is looked up in Salesforce, and a name two records share is held back with the reason.</p>
            </div>
          </div>
        </section>

        <section id="columns" data-anchor="columns">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Columns</h2></div>
          <ul class="rh-tick">
            <li><b>Resize</b> by dragging the edge of a header; <b>double-click</b> the edge to fit the column to its contents.</li>
            <li><b>Wrap text</b> or <b>Clip text</b> from a text column's ▾ menu: wrapped values show up to three lines, clipped ones show the rest in a tooltip.</li>
            <li><b>Frozen columns</b> stay in place while you scroll sideways. Your admin sets how many to start with. <b>Freeze up to this column</b>, in a column's ▾ menu, freezes it and every column before it, up to five; <b>Unfreeze columns</b> lets them all scroll.</li>
            <li><b>Row numbers</b> down the left edge count the rows in the order shown, as in a list view. They are places, not record numbers: sort or search and the rows are numbered from 1 again. Your admin can turn them off.</li>
            <li><b>A formula column</b> (a lock when you hover a cell) is worked out by the grid from other fields; it changes after a save.</li>

              </div>
              <div class="rh-m-modal-f"><span class="rh-m-btn">Cancel</span><span class="rh-m-btn rh-pr">Save</span></div>
            </div></div></div>
            <figcaption>Choose columns on Account People: Business Phone hidden, Email moved before Title. Full Name, kept on screen by the admin, cannot leave Visible.</figcaption>
          </figure>
          <ul class="rh-tick">
            <li><b>Choose columns</b>, the button with three bars beside Refresh (in a narrow space, in the menu beside the search), lists the grid's columns in two boxes, <b>Available</b> and <b>Visible</b>. Click a column, then an arrow: ▸ and ◂ move it between the boxes, ▴ and ▾ move it up and down the Visible list. Click <b>Save</b>. It all works from the keyboard. On a saved view the columns are the view's, and the dialog says so: the change shows <i>You changed this view</i> above the grid, and <b>Save</b> or <b>Save As</b> keeps it.</li>
            <li><b>Hide column</b>, at the bottom of a column's ▾ menu, hides that column at once.</li>
            <li><b>Drag a header</b> by its name onto another to move its column: a blue bar shows which side of that header it lands on. (Its very edges resize the column instead.)</li>
            <li>A column your admin keeps on screen has no <b>Hide column</b>, and shows a lock in the Visible list, which it cannot leave; you can still move it. One column always stays.</li>
            <li>Hiding changes only what you see. Search still looks in hidden columns, a sort, filter or grouping on one stays in force, and <b>Export</b> writes the columns you see, in your order.</li>
          </ul>
          <h3>Your layout is kept</h3>
          <p>The columns you chose and their order, the widths you set, the columns you froze, Wrap or Clip, your sort, your grouping, the rows whose related records you opened (up to 50), and your chart and whether it is open are kept in Salesforce for you, a couple of seconds after each change, and the grid opens that way next time, on any computer. On the grid as your admin set it up your filters are not kept; a <a href="#views" data-anchor-link="views">saved view</a> keeps them. To go back to how your admin set the grid up, click <b>Reset layout</b> (the ↶ button after the Display Key and Filters; in a narrow space, in the menu beside the search). It shows only once something is kept, and only on the grid as your admin set it up: your saved views, and which one is pinned, stay. A tab of related records keeps a layout of its own, the same under every row.</p>
        </section>

        <section id="views" data-anchor="views">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Saved views</h2>
          <p class="rh-sec-sub">As a list view: a named way of looking at the grid, with its own columns, grouping, filters and chart. Save your own, share them, and pick one from the grid's title.</p></div>
          <figure class="rh-rv">

                <tbody>
                  <tr><td class="rh-rn">1</td><td class="rh-lnk">Dickenson Mobile Generators</td><td>Qualification</td><td class="rh-r">$15,000.00</td><td>9/25/2026</td></tr>
                  <tr><td class="rh-rn">2</td><td class="rh-lnk">Pyramid Emergency Generators</td><td>Prospecting</td><td class="rh-r">$100,000.00</td><td>10/2/2026</td></tr>

            <figcaption>Pipeline Review on the view <i>Open opportunities</i>: the picker open under the title, and a filter changed and not saved yet.</figcaption>
          </figure>
          <ul class="rh-tick">
            <li><b>Pick a view.</b> Click the grid's title, or its ▾. <b>Recent Views</b> lists the ones you opened last, the one shown ticked and the one you pinned marked <span class="rh-v rh-plain">(Pinned view)</span>; <b>All Other Views</b> lists the rest, A to Z. Type in <b>Search views...</b> to narrow them. The grid as your admin set it up is always there, under the grid's own name. On a view the title reads <span class="rh-v rh-plain">Pipeline Review › Open opportunities</span>, on one line, so the grid's name stays where it is.</li>
            <li><b>Save one of your own.</b> Open <b>View Controls</b>, the gear with ▾ after the search box, and choose <b>New</b>: name it, choose who sees it, and click <b>Save</b>. A new view starts as your admin set the grid up, with the Filters panel open to add its filters. <b>Clone</b> saves the view you're on, as it is now, under a new name (<span class="rh-v rh-plain">Copy of …</span> to start).</li>
            <li><b>Change it, then save.</b> Change a view's filters, columns, grouping or chart and a bar says <span class="rh-v rh-plain">You changed this view: the filters.</span> <b>Save</b> keeps the change for everyone who sees the view; only its owner has Save. <b>Save As</b> saves it as a view of your own; <b>Revert</b> puts the view back as saved. Until then the change stays, even after a reload.</li>
            <li><b>Yours on every view:</b> the sort you choose (each view remembers yours), column widths, Wrap or Clip, and the rows you open. They never change a view for anyone else. <b>Reset Column Sorting</b> and <b>Reset Column Widths</b>, in View Controls, put back the view's sort and the grid's own widths.</li>
            <li><b>Pin a view</b> with the pin beside the title, and the grid opens on it for you from then on. <span class="rh-v rh-plain">This view is pinned.</span> shows on the one it opens on; with none pinned, that is the grid as your admin set it up.</li>
            <li><b>Share a view</b> with <b>Sharing Settings</b> in View Controls: <span class="rh-v rh-plain">Only I can see this view</span>, <span class="rh-v rh-plain">All users can see this view</span>, or <span class="rh-v rh-plain">Share view with groups of users</span>, which searches roles, and public groups once your org has some, by name. Sharing needs Salesforce's Manage Public List Views permission, as sharing a list view does; without it you see only the first choice. A view someone shared with you says who on the count line (<span class="rh-v rh-plain">Shared by Jenna Rossi</span>); you can use it and save a copy, not change it.</li>
            <li><b>Rename</b> and <b>Delete</b>, in View Controls, are for views you own. Delete asks first, and the grid goes back to how your admin set it up.</li>
            <li><b>The chart is part of the view.</b> A view keeps its chart, and whether its panel is open; under the chart's title it says <span class="rh-v rh-plain">kept with this view</span> (on the grid as your admin set it up, <span class="rh-v rh-plain">kept for you</span>).</li>
            <li><b>Not in a tab of related records.</b> Saved views are for a grid on its own; a child table keeps your layout as before.</li>
          </ul>
        </section>

            <ul class="rh-tick">
              <li><b>Below 480 pixels wide</b> each record becomes a card: its title and three fields, with <b>Show all fields</b> for the rest.</li>
              <li><b>Tap a value</b> to edit it. The Save bar stays at the bottom of the screen.</li>
              <li><b>Cards come 50 at a time</b>, with <b>Show more</b>; sorting is a menu at the top.</li>
              <li><b>The toolbar's buttons fold into one menu</b>, <b>List actions</b>, beside the search, wherever they don't all fit across the grid (in a narrow column of a record page, say), as they do in a tab of related records; <b>View Controls</b>, for saved views, stays beside the search too.</li>
              <li><b>Each card</b> has its checkbox and its actions menu beside the title, and <b>Show related records</b> when it has any. Ranges, paste, changing the grouping, Hide column and frozen columns are for the table only.</li>

        <section id="a11y" data-anchor="a11y">
          <div class="rh-sec-head"><span class="rh-sec-num">More</span><h2>Screen readers</h2></div>
          <div class="rh-prose">
            <p>Rowhouse is built as an accessible grid: one tab stop, arrow-key navigation, each cell announced with its column, a display rule's meaning read after the value, and every action (a paste, an undo, a selection) announced in words. Its target is WCAG 2.2 AA. Automated accessibility checks run on every change, and it has been tested by hand with a screen reader. Screen readers differ, so tell your admin about anything that does not read well.</p>
          </div>
